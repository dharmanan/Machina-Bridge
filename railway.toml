# Machina Intelligence: one always-on service. Serverless (app sleeping) must be OFF and no cron schedule may be set:
# the in-process scheduler indexes checkpoint + 1 hour on its own, with or without HTTP traffic.
[build]
builder = "RAILPACK"
buildCommand = "node --check scripts/serve-compact-intelligence.mjs && node --check scripts/run-compact-hour.mjs && node --check server/compact/read-model.js && node --check server/compact/http.js && node --check server/compact/scheduler.js"

[deploy]
# Node 24 V8 CLI limits override Worker resourceLimits, even with execArgv: []. Bound both the parent and read worker
# to 48/4 MiB (60 MiB total V8 heap), rather than removing the parent's limit or relaxing the worker's safety check.
startCommand = "exec node --max-old-space-size=48 --max-semi-space-size=4 scripts/serve-compact-intelligence.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 300
