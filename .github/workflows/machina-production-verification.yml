name: Machina production verification

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_release:
        description: Run complete pre-merge acceptance
        type: boolean
        default: false
      legacy:
        description: Also run paused/retired feature suites (Borrow, Arc Intelligence UI)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: machina-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Suite scope lives in scripts/ci-suites.json; verify-ci-coverage keeps it in step with the app.
      - name: Typecheck and fast safety suites (CCTP, Sui/Arc wallets, recovery, mismatch, gates)
        run: |
          npx tsc --noEmit
          node scripts/run-suites.mjs fast
  source-regressions:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-check]')) || (github.event_name == 'workflow_dispatch' && inputs.full_release)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint and production bundle (the build runs tsc)
        run: |
          npm run lint
          npm run build
      - name: Swap, Solana Bridge, Activity and dependency release suites
        run: node scripts/run-suites.mjs full --timings suite-timings-full.json
      - name: Production dependency reachability evidence
        run: node scripts/verify-security-bundle.mjs security-bundle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-bundle-evidence
          path: |
            security-bundle.json
            suite-timings-full.json

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Raw dependency advisories and explicit risk report
        run: |
          if npm audit --omit=dev --json > npm-audit-production.json; then
            AUDIT_EXIT=0
          else
            AUDIT_EXIT=$?
          fi
          node scripts/report-dependency-audit.mjs npm-audit-production.json "$AUDIT_EXIT"
          if npm audit --json > npm-audit-full.json; then
            FULL_AUDIT_EXIT=0
          else
            FULL_AUDIT_EXIT=$?
          fi
          node scripts/report-dependency-audit.mjs npm-audit-full.json "$FULL_AUDIT_EXIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-production-audit
          path: npm-audit-*.json

  browser-regressions:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-check]')) || (github.event_name == 'workflow_dispatch' && inputs.full_release)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Playwright browser cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.58.2-${{ runner.os }}
      - name: Prepare Chromium test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.58.2
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx --yes playwright@1.58.2 install-deps chromium
          else
            npx --yes playwright@1.58.2 install --with-deps chromium
          fi
          CHROME="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux64/chrome' -type f | head -n 1)"
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
          sudo mkdir -p /workspace/artifacts
          sudo chown -R "$(id -u):$(id -g)" /workspace/artifacts
      - name: Bridge, Sui, Swap and app-shell real-Chromium fixture regressions (no wallet sends)
        env:
          PLAYWRIGHT_CORE_PATH: ${{ github.workspace }}/node_modules/playwright-core
        run: node scripts/run-suites.mjs browser --timings suite-timings-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-suite-timings
          path: suite-timings-browser.json

  # Paused Borrow and retired Arc Intelligence UI suites: kept runnable, never on push.
  legacy-regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare Chromium test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.58.2
          npx --yes playwright@1.58.2 install --with-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux64/chrome' -type f | head -n 1)"
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
          sudo mkdir -p /workspace/artifacts/borrow-production-ui
          sudo chown -R "$(id -u):$(id -g)" /workspace/artifacts
      - name: Borrow and Arc Intelligence legacy suites
        env:
          PLAYWRIGHT_CORE_PATH: ${{ github.workspace }}/node_modules/playwright-core
        run: node scripts/run-suites.mjs legacy
