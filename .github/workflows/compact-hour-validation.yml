# Read-only validation of the compact source-first Arc engine (Stage 1.5).
# Runs only when compact Stage 1.5 files are pushed to feature/arc-intelligence.
# Dependency policy: the compact engine, its tests and the validator import only node: built-ins and repository
# files (asserted by the unit tests), so nothing is installed: no npm ci, no lifecycle scripts, no registry access.
# No secrets, no database service, no Railway, no persistent process. Network: rpc.mainnet.arc.io (primary) and
# arc.drpc.org (secondary cross-check only), read-only, at most one request per second per provider.
name: Compact hour validation

on:
  push:
    branches:
      - feature/arc-intelligence
    paths:
      - 'server/compact/**'
      - 'scripts/verify-arc-intelligence-compact.mjs'
      - 'scripts/validate-compact-hour.mjs'
      - 'scripts/fixtures/compact-*.json'
      - '.github/workflows/compact-hour-validation.yml'

permissions:
  contents: read

concurrency:
  group: compact-hour-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Show runtime and commit
        run: |
          node --version
          git rev-parse HEAD
          echo "COMPACT_SQLITE_DIR=$RUNNER_TEMP/compact-sqlite" >> "$GITHUB_ENV"

      - name: Compact unit tests (offline, node:sqlite store tests required)
        env:
          COMPACT_REQUIRE_SQLITE: '1'
        run: |
          mkdir -p "$COMPACT_SQLITE_DIR"
          node scripts/verify-arc-intelligence-compact.mjs

      - name: Full-hour A2 equivalence and dRPC cross-check (live, read-only)
        env:
          HOUR: '2026-10-01T07:00:00Z'
        run: node --expose-gc scripts/validate-compact-hour.mjs "$HOUR"

      - name: Delete temporary SQLite files
        if: always()
        run: |
          rm -rf "$COMPACT_SQLITE_DIR"
          test ! -e "$COMPACT_SQLITE_DIR"
